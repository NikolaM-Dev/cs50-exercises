{% extends "layout.html" %} {% block title %} Sell {% endblock %} {% block main
%}
<h1>Sell</h1>
<form class="mt-5" action="/sell" method="post">
  <div class="mb-3">
    <select name="symbol" class="form-select mx-auto" required>
      <option value="" selected disabled>Select Stock</option>
      {% for stock in stocks %}
      <option value="{{ stock['symbol'] }}">{{ stock['symbol']}}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <input
      class="form-control mx-auto w-auto"
      name="shares"
      placeholder="Shares"
      type="number"
      required
      min="1"
    />
  </div>
  <button class="btn btn-primary" type="submit">sell</button>
</form>
{% endblock %}
