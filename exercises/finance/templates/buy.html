{% extends "layout.html" %} {% block title %} Buy {% endblock %} {% block main
%}
<h1>Buy</h1>
<form class="mt-5" action="/buy" method="post">
  <div class="mb-3">
    <input
      autocomplete="off"
      autofocus
      class="form-control mx-auto w-auto"
      name="symbol"
      placeholder="Symbol"
      type="text"
      required
    />
  </div>
  <div class="mb-3">
    <input
      class="form-control mx-auto w-auto"
      name="shares"
      placeholder="Shares"
      type="number"
      required
      min="1"
    />
  </div>
  <button class="btn btn-primary" type="submit">Buy</button>
</form>
{% endblock %}
